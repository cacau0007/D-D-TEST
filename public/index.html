<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thornwall — Mesa do Mestre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15120e;
  --bg2:#1d1812;
  --panel:#241d15;
  --panel2:#2c2419;
  --ink:#ede0c8;
  --ink-soft:#b9a884;
  --gold:#c9a14a;
  --gold-soft:#8a6e34;
  --blood:#8e2c24;
  --blood-bright:#c0392b;
  --green:#5d7a3a;
  --blue:#3f6f9c;
  --border:#473720;
  --border-soft:#352a1a;
  --grid:rgba(201,161,74,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'EB Garamond',serif;
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
h1,h2,h3,h4,.cinzel{font-family:'Cinzel',serif;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer;color:var(--ink);background:var(--panel2);
  border:1px solid var(--border);border-radius:5px;padding:6px 10px;transition:.12s;font-size:14px}
button:hover{border-color:var(--gold-soft);background:#332a1c}
button:active{transform:scale(.97)}
button.gold{background:linear-gradient(180deg,#3a2f1c,#2a2113);border-color:var(--gold-soft);color:var(--gold)}
button.gold:hover{border-color:var(--gold);color:#e3c068}
button.danger:hover{border-color:var(--blood-bright);color:#e08a82}
input,textarea,select{font-family:inherit;background:#1a1510;color:var(--ink);
  border:1px solid var(--border);border-radius:4px;padding:5px 7px;font-size:14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-soft)}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-track{background:var(--bg2)}
.scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--gold-soft)}

/* ===== Top bar ===== */
#topbar{
  height:52px;flex:0 0 52px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:linear-gradient(180deg,#2a2114,#1d1711);
  border-bottom:2px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:30
}
#topbar h1{font-size:19px;color:var(--gold);white-space:nowrap}
#topbar .sub{font-size:13px;color:var(--ink-soft);font-style:italic;margin-left:-6px}
.spacer{flex:1}
.dice-quick{display:flex;gap:5px}
.dice-quick button{padding:5px 9px;font-size:13px;min-width:38px;font-family:'Cinzel',serif}

/* ===== Layout ===== */
#main{flex:1;display:flex;min-height:0}
#left{width:215px;flex:0 0 215px;background:var(--bg2);border-right:2px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
#center{flex:1;position:relative;min-width:0;background:
  radial-gradient(circle at 50% 30%,#221b12,#120f0b);overflow:hidden}
#right{width:340px;flex:0 0 340px;background:var(--bg2);border-left:2px solid var(--border);
  display:flex;flex-direction:column;min-height:0}

.panel-title{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);text-transform:uppercase;
  letter-spacing:1.5px;padding:11px 14px 7px;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between}

/* ===== Scene list ===== */
#sceneList{overflow-y:auto;flex:1}
.scene-item{padding:11px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:.12s}
.scene-item:hover{background:#251e14}
.scene-item.active{background:linear-gradient(90deg,#3a2d18,transparent);
  border-left:3px solid var(--gold)}
.scene-item .num{font-family:'Cinzel',serif;font-size:11px;color:var(--gold-soft)}
.scene-item .nm{font-size:15px;color:var(--ink);margin-top:1px}
.scene-item .tag{font-size:11px;color:var(--ink-soft);font-style:italic}

/* ===== Scene description ===== */
#sceneInfo{padding:11px 14px;border-top:1px solid var(--border);background:#1a140e;
  max-height:38%;overflow-y:auto;flex:0 0 auto}
#sceneInfo h3{font-size:15px;color:var(--gold);margin-bottom:5px}
#sceneInfo p{font-size:13.5px;line-height:1.5;color:var(--ink-soft);white-space:pre-wrap}
#sceneInfo .read{background:#0f0c08;border-left:3px solid var(--gold-soft);padding:8px 10px;
  margin:8px 0;font-style:italic;color:#d8c7a2;font-size:13px;line-height:1.55}

/* ===== Map ===== */
#mapWrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
#mapWrap.panning{cursor:grabbing}
#map{position:absolute;top:0;left:0;transform-origin:0 0}
#mapBg{position:absolute;top:0;left:0;width:1400px;height:1000px;
  background-size:cover;background-position:center;border:1px solid var(--border)}
#grid{position:absolute;top:0;left:0;width:1400px;height:1000px;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:50px 50px}
.sceneLabel{position:absolute;top:14px;left:14px;font-family:'Cinzel',serif;font-size:22px;
  color:var(--gold);text-shadow:0 2px 8px #000;pointer-events:none}

/* ===== Tokens ===== */
.token{position:absolute;width:50px;height:50px;border-radius:50%;cursor:grab;
  display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;
  font-weight:700;font-size:16px;color:#fff;user-select:none;
  border:2px solid rgba(0,0,0,.5);box-shadow:0 3px 8px rgba(0,0,0,.6);transition:box-shadow .12s}
.token:hover{box-shadow:0 0 0 3px var(--gold),0 3px 10px #000}
.token.selected{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.token.dead{filter:grayscale(1) brightness(.5)}
.token.dead::after{content:'✕';position:absolute;font-size:34px;color:var(--blood-bright);
  text-shadow:0 0 4px #000}
.token .hpbar{position:absolute;bottom:-9px;left:2px;right:2px;height:5px;background:#2a0d0a;
  border-radius:3px;overflow:hidden;border:1px solid rgba(0,0,0,.6)}
.token .hpfill{height:100%;background:linear-gradient(90deg,#7a1f17,#c0392b);transition:width .2s}
.token .lbl{position:absolute;top:-17px;font-family:'EB Garamond',serif;font-weight:500;
  font-size:11px;color:var(--ink);white-space:nowrap;text-shadow:0 1px 3px #000;
  background:rgba(15,12,8,.7);padding:0 5px;border-radius:3px}

#mapControls{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:10}
#mapControls button{width:36px;height:36px;padding:0;font-size:18px;
  background:rgba(36,29,21,.92);backdrop-filter:blur(4px)}
#mapHint{position:absolute;bottom:14px;left:14px;font-size:12px;color:var(--ink-soft);
  background:rgba(15,12,8,.7);padding:5px 9px;border-radius:5px;font-style:italic}

/* ===== Right column sections ===== */
#right .section{border-bottom:2px solid var(--border);display:flex;flex-direction:column;min-height:0}
#tokenList{max-height:170px;overflow-y:auto}
.tlrow{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;
  border-bottom:1px solid var(--border-soft);font-size:14px}
.tlrow:hover{background:#251e14}
.tlrow.sel{background:#33291a}
.tlrow .dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;border:1px solid rgba(0,0,0,.4)}
.tlrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlrow .hp{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* stat block */
#detail{flex:1;overflow-y:auto;padding:0}
#detailEmpty{padding:30px 16px;text-align:center;color:var(--ink-soft);font-style:italic;font-size:14px}
.sb{padding:13px 15px}
.sb .sbtop{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sb .sbtop .dot{width:20px;height:20px;border-radius:50%;flex:0 0 20px}
.sb h2{font-size:20px;color:var(--gold);line-height:1}
.sb .meta{font-size:12.5px;font-style:italic;color:var(--ink-soft);margin-bottom:9px}
.sb .rule{height:2px;background:linear-gradient(90deg,var(--gold-soft),transparent);margin:8px 0}
.hpctrl{display:flex;align-items:center;gap:6px;margin:9px 0;flex-wrap:wrap}
.hpctrl .big{font-family:'Cinzel',serif;font-size:24px;color:#e08a82;font-variant-numeric:tabular-nums}
.hpctrl input{width:54px;text-align:center}
.hpctrl button{padding:5px 8px}
.acrow{display:flex;gap:14px;margin:8px 0;font-size:14px}
.acrow b{color:var(--gold)}
.abilities{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:9px 0}
.ab{background:#1a140e;border:1px solid var(--border-soft);border-radius:4px;text-align:center;padding:5px 2px}
.ab .k{font-family:'Cinzel',serif;font-size:10px;color:var(--gold-soft)}
.ab .v{font-size:15px}.ab .m{font-size:11px;color:var(--ink-soft)}
.sbfield{margin:7px 0;font-size:13.5px;line-height:1.45}
.sbfield b{color:var(--gold);font-family:'Cinzel',serif;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.action{margin:7px 0;font-size:13.5px;line-height:1.45}
.action b{color:#d8b96a}
.sb textarea{min-height:54px;resize:vertical}
.editrow{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;margin:5px 0;font-size:13px}
.editrow label{color:var(--ink-soft)}

/* ===== Dice ===== */
#diceArea{flex:0 0 auto}
#diceLog{max-height:120px;overflow-y:auto;padding:6px 12px;font-size:13px}
.dlog{padding:3px 0;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;gap:8px}
.dlog .res{font-family:'Cinzel',serif;color:var(--gold);font-weight:700}
.dlog .crit{color:#7bd47b}.dlog .fail{color:var(--blood-bright)}
.dice-custom{display:flex;gap:6px;padding:8px 12px}
.dice-custom input{flex:1}

/* ===== Initiative ===== */
#initArea{flex:1;display:flex;flex-direction:column;min-height:0}
#initList{flex:1;overflow-y:auto}
.initrow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border-soft);font-size:14px}
.initrow.turn{background:linear-gradient(90deg,#3a2d18,transparent);border-left:3px solid var(--gold)}
.initrow .roll{font-family:'Cinzel',serif;color:var(--gold);width:26px;text-align:center;font-weight:700}
.initrow .nm{flex:1}
.initrow input{width:46px;text-align:center;padding:3px}
.initctrl{display:flex;gap:6px;padding:8px 12px}

/* modal */
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;
  justify-content:center;z-index:100}
#modalBg.show{display:flex}
.modal{background:var(--panel);border:2px solid var(--border);border-radius:8px;
  width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:18px;box-shadow:0 10px 40px #000}
.modal h3{color:var(--gold);margin-bottom:12px;font-size:18px}
.modal .fld{margin:9px 0}
.modal label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px}
.modal .row{display:flex;gap:8px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.swatch{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.swatch span{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch span.sel{border-color:var(--gold)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--gold-soft);color:var(--gold);padding:9px 18px;border-radius:6px;
  z-index:200;opacity:0;transition:.3s;pointer-events:none;font-size:14px}
.toast.show{opacity:1}
.mini{font-size:12px;padding:3px 7px}
</style>
</head>
<body>

<div id="topbar">
  <h1>⚜ Thornwall</h1>
  <span class="sub">Mesa do Mestre</span>
  <div class="spacer"></div>
  <div class="dice-quick" id="diceQuick"></div>
  <button class="mini" onclick="saveNow(true)">💾 Salvar</button>
  <button class="mini" onclick="exportData()">⬇ Exportar</button>
  <button class="mini" onclick="document.getElementById('importFile').click()">⬆ Importar</button>
  <button class="mini danger" onclick="resetAll()">↺ Reset</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
</div>

<div id="main">
  <!-- LEFT -->
  <div id="left">
    <div class="panel-title">Cenas <button class="mini" onclick="addScene()">+ Nova</button></div>
    <div id="sceneList" class="scroll"></div>
    <div id="sceneInfo" class="scroll"></div>
  </div>

  <!-- CENTER -->
  <div id="center">
    <div id="mapWrap">
      <div id="map">
        <div id="mapBg"></div>
        <div id="grid"></div>
        <div class="sceneLabel" id="sceneLabel"></div>
      </div>
    </div>
    <div id="mapHint">Arraste tokens • arraste o fundo p/ mover • roda do mouse p/ zoom • duplo-clique no token p/ editar nome</div>
    <div id="mapControls">
      <button onclick="zoomBy(1.15)" title="Zoom +">+</button>
      <button onclick="zoomBy(.87)" title="Zoom -">−</button>
      <button onclick="resetView()" title="Centralizar">⊙</button>
      <button onclick="openTokenModal()" title="Adicionar token" class="gold">＋</button>
    </div>
  </div>

  <!-- RIGHT -->
  <div id="right">
    <div class="section">
      <div class="panel-title">Tokens nesta cena
        <button class="mini" onclick="openTokenModal()">+ Token</button></div>
      <div id="tokenList" class="scroll"></div>
    </div>
    <div class="section" style="flex:1">
      <div class="panel-title">Ficha <span id="detailActions"></span></div>
      <div id="detail" class="scroll"><div id="detailEmpty">Clique num token pra ver a ficha</div></div>
    </div>
    <div class="section" id="diceArea">
      <div class="panel-title">Dados</div>
      <div class="dice-custom">
        <input id="diceFormula" placeholder="ex: 2d6+3 ou 1d20" onkeydown="if(event.key==='Enter')rollFormula()">
        <button class="gold" onclick="rollFormula()">Rolar</button>
      </div>
      <div id="diceLog" class="scroll"></div>
    </div>
    <div class="section" id="initArea">
      <div class="panel-title">Iniciativa
        <span><button class="mini" onclick="autoInit()" title="Rola iniciativa dos inimigos">🎲 Auto</button>
        <button class="mini" onclick="clearInit()">Limpar</button></span></div>
      <div id="initList" class="scroll"></div>
      <div class="initctrl">
        <button onclick="addInitManual()">+ Combatente</button>
        <button class="gold" style="flex:1" onclick="nextTurn()">Próximo turno ▸</button>
      </div>
    </div>
  </div>
</div>

<div id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

   ========================================================= */
let view={x:-300,y:-150,z:.8};
function applyView(){$('#map').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;}
function zoomBy(f){const c=$('#center').getBoundingClientRect();
  const cx=c.width/2,cy=c.height/2;
  const wx=(cx-view.x)/view.z,wy=(cy-view.y)/view.z;
  view.z=Math.max(.3,Math.min(2.2,view.z*f));
  view.x=cx-wx*view.z;view.y=cy-wy*view.z;applyView();}
function resetView(){view={x:-200,y:-120,z:.78};applyView();}

const mapWrap=$('#mapWrap');
let panning=false,panStart;
mapWrap.addEventListener('mousedown',e=>{
  if(e.target.closest('.token'))return;
  panning=true;mapWrap.classList.add('panning');
  panStart={x:e.clientX-view.x,y:e.clientY-view.y};});
window.addEventListener('mousemove',e=>{
  if(panning){view.x=e.clientX-panStart.x;view.y=e.clientY-panStart.y;applyView();}});
window.addEventListener('mouseup',()=>{panning=false;mapWrap.classList.remove('panning');});
mapWrap.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:.9);},{passive:false});

let selected=null;
function sceneTokens(){return D.tokens.filter(t=>t.scene===D.activeScene);}
function renderTokens(){
  $$('.token').forEach(e=>e.remove());
  const map=$('#map');
  sceneTokens().forEach(t=>{
    const el=document.createElement('div');
    el.className='token'+(t.id===selected?' selected':'')+(t.hp<=0?' dead':'');
    el.style.left=t.x+'px';el.style.top=t.y+'px';el.style.background=t.color;
    el.dataset.id=t.id;
    const init=t.name.replace(/[^A-Za-zÀ-ÿ0-9]/g,'').slice(0,2).toUpperCase()||'??';
    const pct=t.maxhp?Math.max(0,Math.min(100,100*t.hp/t.maxhp)):0;
    el.innerHTML=`<span class="lbl">${esc(t.name)}</span>${init}
      ${t.maxhp?`<div class="hpbar"><div class="hpfill" style="width:${pct}%"></div></div>`:''}`;
    makeDraggable(el,t);
    el.addEventListener('dblclick',ev=>{ev.stopPropagation();
      const nn=prompt('Nome do token:',t.name);if(nn){t.name=nn;render();save();}});
    map.appendChild(el);
  });
  renderTokenList();
}
function makeDraggable(el,t){
  let dragging=false,off,moved;
  el.addEventListener('mousedown',e=>{
    e.stopPropagation();dragging=true;moved=false;
    selectToken(t.id);
    const r=$('#map').getBoundingClientRect();
    off={x:(e.clientX-r.left)/view.z-t.x,y:(e.clientY-r.top)/view.z-t.y};
    el.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',e=>{
    if(!dragging)return;moved=true;
    const r=$('#map').getBoundingClientRect();
    t.x=Math.round((e.clientX-r.left)/view.z-off.x);
    t.y=Math.round((e.clientY-r.top)/view.z-off.y);
    el.style.left=t.x+'px';el.style.top=t.y+'px';
  });
  window.addEventListener('mouseup',()=>{if(dragging){dragging=false;el.style.cursor='grab';
    if(moved)save();}});
}
function renderTokenList(){
  const box=$('#tokenList');box.innerHTML='';

function typeLabel(t){return{pc:'Jogador',npc:'NPC',enemy:'Inimigo'}[t]||t;}
function dmg(id,sign){const t=D.tokens.find(x=>x.id===id);
  let n=sign===-99?t.maxhp:parseInt($('#dmgIn').value||0);
  if(sign===-99){t.hp=t.maxhp;}else{t.hp=Math.max(0,Math.min(t.maxhp,t.hp-sign*n));}
  render();save();}

   DICE
   ========================================================= */
function renderDiceQuick(){
  const q=$('#diceQuick');q.innerHTML='';
  [4,6,8,10,12,20,100].forEach(d=>{
    const b=document.createElement('button');b.textContent='d'+d;
    b.onclick=()=>rollDie(d);q.appendChild(b);});
}
function rollDie(d){const r=1+Math.floor(Math.random()*d);
  logDice('d'+d,[r],0,r,d);return r;}
function rollFormula(){
  const f=($('#diceFormula').value||'1d20').trim().toLowerCase();
  const m=f.match(/^(\d*)d(\d+)\s*([+-]\s*\d+)?$/);
  if(!m){toast('Formato: XdY+Z (ex: 2d6+3)');return;}
  const n=parseInt(m[1]||1),d=parseInt(m[2]),mod=m[3]?parseInt(m[3].replace(/\s/g,'')):0;
  if(n>50){toast('Máx 50 dados');return;}
  const rolls=[];let sum=0;for(let i=0;i<n;i++){const r=1+Math.floor(Math.random()*d);rolls.push(r);sum+=r;}
  logDice(f,rolls,mod,sum+mod,d);
}
function rollFor(id){const t=D.tokens.find(x=>x.id===id);
  const r=1+Math.floor(Math.random()*20);
  logDice(t.name+' d20',[r],0,r,20);}
function logDice(label,rolls,mod,total,die){
  D.dice.unshift({label,rolls,mod,total,die,t:Date.now()});
  if(D.dice.length>40)D.dice.pop();renderDiceLog();save();
  toast(`${label}: ${total}`);
}
function renderDiceLog(){
  const box=$('#diceLog');box.innerHTML='';
  D.dice.forEach(e=>{
    let cls='';if(e.die===20&&e.rolls.length===1){if(e.rolls[0]===20)cls='crit';if(e.rolls[0]===1)cls='fail';}
    const detail=e.rolls.length>1||e.mod?`[${e.rolls.join(',')}]${e.mod?(e.mod>0?'+'+e.mod:e.mod):''}`:'';
    const d=document.createElement('div');d.className='dlog';
    d.innerHTML=`<span>${esc(e.label)} <span style="color:var(--ink-soft);font-size:12px">${detail}</span></span>
      <span class="res ${cls}">${e.total}</span>`;
    box.appendChild(d);});
}

function renderInit(){
  const box=$('#initList');box.innerHTML='';
  if(!D.init.length){box.innerHTML='<div style="padding:12px;color:var(--ink-soft);font-style:italic;font-size:13px">Sem combatentes. Use 🎲 Auto ou + Combatente.</div>';return;}
  D.init.forEach((c,i)=>{
    const r=document.createElement('div');r.className='initrow'+(i===D.turn?' turn':'');
    const tk=c.tokenId?D.tokens.find(t=>t.id===c.tokenId):null;
    const hp=tk?` <span style="color:var(--ink-soft);font-size:12px">${tk.hp}/${tk.maxhp}</span>`:'';
    r.innerHTML=`<input type="number" value="${c.roll}" onchange="setInit(${i},this.value)">
      <span class="nm">${esc(c.name)}${hp}</span>
      <button class="mini danger" onclick="rmInit(${i})">✕</button>`;
    box.appendChild(r);});
}
function setInit(i,v){D.init[i].roll=parseInt(v)||0;sortInit();}
function sortInit(){const cur=D.init[D.turn];
  D.init.sort((a,b)=>b.roll-a.roll);
  D.turn=Math.max(0,D.init.indexOf(cur));renderInit();save();}
function addToInit(id){const t=D.tokens.find(x=>x.id===id);
  if(D.init.find(c=>c.tokenId===id)){toast('Já está na iniciativa');return;}
  const r=1+Math.floor(Math.random()*20)+Math.floor((t.stat.dex-10)/2);
  D.init.push({name:t.name,roll:r,tokenId:id});sortInit();toast(t.name+' entrou ('+r+')');}
function autoInit(){
  sceneTokens().filter(t=>t.type==='enemy'&&t.hp>0).forEach(t=>{
    if(D.init.find(c=>c.tokenId===t.id))return;
    const r=1+Math.floor(Math.random()*20)+Math.floor((t.stat.dex-10)/2);
    D.init.push({name:t.name,roll:r,tokenId:t.id});});
  sortInit();toast('Iniciativa dos inimigos rolada');}
function addInitManual(){const nm=prompt('Nome do combatente:');if(!nm)return;
  const r=parseInt(prompt('Iniciativa:','10'))||10;
  D.init.push({name:nm,roll:r,tokenId:null});sortInit();}
function rmInit(i){D.init.splice(i,1);if(D.turn>=D.init.length)D.turn=0;renderInit();save();}
function clearInit(){if(confirm('Limpar a ordem de iniciativa?')){D.init=[];D.turn=0;renderInit();save();}}
function nextTurn(){if(!D.init.length)return;D.turn=(D.turn+1)%D.init.length;renderInit();save();
  toast('Vez de: '+D.init[D.turn].name);}

/* =========================================================
   MODAL / UTIL
   ========================================================= */
function openModal(html){$('#modalBody').innerHTML=html;$('#modalBg').classList.add('show');}
function closeModal(){$('#modalBg').classList.remove('show');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1600);}
function esc(s){return(s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
function nl(s){return esc(s).replace(/\\n/g,'<br>').replace(/\n/g,'<br>');}

function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='thornwall-mesa.json';a.click();toast('Exportado');}
function importData(ev){const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);saveNow();render();toast('Importado');}
    catch(e){toast('Arquivo inválido');}};r.readAsText(f);ev.target.value='';}
function resetAll(){if(confirm('Restaurar a one-shot original? Suas mudanças serão perdidas.')){
  D=DEFAULT_DATA();selected=null;saveNow();render();resetView();toast('Restaurado');}}

/* =========================================================
   RENDER
   ========================================================= */
function render(){renderScenes();renderTokens();renderDetail();renderDiceLog();renderInit();}
function init(){load();renderDiceQuick();render();applyView();
  window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});}
init();
</script>
