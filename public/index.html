<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thornwall — Mesa do Mestre</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#15120e;--bg2:#1d1812;--panel:#241d15;--panel2:#2c2419;--ink:#ede0c8;--ink-soft:#b9a884;--gold:#c9a14a;--gold-soft:#8a6e34;--red:#c0392b;--green:#5d7a3a;--border:#473720;--grid:rgba(201,161,74,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'EB Garamond',serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
h2,h3,.cinzel{font-family:'Cinzel',serif;letter-spacing:.5px}
button{font-family:inherit;cursor:pointer;color:var(--ink);background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:5px 9px;transition:.12s;font-size:13px}
button:hover{border-color:var(--gold-soft);background:#332a1c}
button.gold{background:#2a2113;border-color:var(--gold-soft);color:var(--gold)}
button.gold:hover{border-color:var(--gold);color:#e3c068}
button.red{background:#2a1010;border-color:#6b2020;color:#e08080}
button.red:hover{border-color:var(--red);color:#ffaaaa}
button.sm{padding:3px 7px;font-size:12px}
input,textarea,select{font-family:inherit;background:#1a1510;color:var(--ink);border:1px solid var(--border);border-radius:3px;padding:4px 7px;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-soft)}
.sc::-webkit-scrollbar{width:7px;height:7px}
.sc::-webkit-scrollbar-track{background:var(--bg2)}
.sc::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* TOP BAR */
#top{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,#2a2114,#1d1711);border-bottom:2px solid var(--border);z-index:30}
#top h1{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);white-space:nowrap}
.sp{flex:1}
.dq{display:flex;gap:4px}
.dq button{padding:4px 8px;font-size:12px;font-family:'Cinzel',serif}

/* MAIN */
#main{flex:1;display:flex;min-height:0}

/* LEFT */
#left{width:200px;flex:0 0 200px;background:var(--bg2);border-right:2px solid var(--border);display:flex;flex-direction:column;min-height:0}
.ph{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;padding:9px 12px 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#sceneList{overflow-y:auto;flex:1}
.si{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s}
.si:hover{background:#251e14}
.si.active{background:linear-gradient(90deg,#3a2d18,transparent);border-left:3px solid var(--gold)}
.si .sn{font-size:14px;color:var(--ink)}
.si .st{font-size:11px;color:var(--ink-soft);font-style:italic}
#sceneNote{padding:10px 12px;border-top:1px solid var(--border);background:#1a140e;max-height:35%;overflow-y:auto;flex:0 0 auto}
#sceneNote h3{font-size:14px;color:var(--gold);margin-bottom:4px;font-family:'Cinzel',serif}
#sceneNote .rb{background:#0f0c08;border-left:3px solid var(--gold-soft);padding:7px 9px;margin:6px 0;font-style:italic;color:#d8c7a2;font-size:12.5px;line-height:1.5}
#sceneNote p{font-size:12.5px;color:var(--ink-soft);line-height:1.45;white-space:pre-wrap}

/* CENTER — MAP */
#center{flex:1;position:relative;overflow:hidden;background:#15120e}
#mapWrap{position:absolute;inset:0;cursor:grab;overflow:hidden}
#mapWrap.pan{cursor:grabbing}
#map{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#mapImg{position:absolute;top:0;left:0;width:1400px;height:1000px;background-size:cover;background-position:center;background-color:#1a140e}
#gridLayer{position:absolute;top:0;left:0;width:1400px;height:1000px;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:50px 50px}
#mapCtrls{position:absolute;bottom:10px;right:10px;display:flex;flex-direction:column;gap:5px;z-index:10}
#mapCtrls button{width:34px;height:34px;padding:0;font-size:17px;background:rgba(36,29,21,.9)}
#hint{position:absolute;bottom:12px;left:12px;font-size:11px;color:var(--ink-soft);background:rgba(15,12,8,.7);padding:4px 8px;border-radius:4px;pointer-events:none}

/* TOKENS */
.tok{position:absolute;width:48px;height:48px;border-radius:50%;cursor:grab;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:#fff;user-select:none;
  border:2.5px solid rgba(0,0,0,.5);box-shadow:0 3px 8px rgba(0,0,0,.6);transition:box-shadow .1s}
.tok:hover{box-shadow:0 0 0 3px var(--gold),0 3px 10px #000}
.tok.sel{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.tok.dead{filter:grayscale(1) brightness(.45)}
.tok.dead::after{content:'✕';position:absolute;font-size:30px;color:var(--red);text-shadow:0 0 4px #000}
.tok .lbl{position:absolute;top:-16px;font-family:'EB Garamond',serif;font-size:11px;color:var(--ink);
  white-space:nowrap;text-shadow:0 1px 3px #000;background:rgba(15,12,8,.75);padding:0 5px;border-radius:3px}
.tok .hb{position:absolute;bottom:-8px;left:2px;right:2px;height:5px;background:#2a0d0a;border-radius:3px;overflow:hidden}
.tok .hf{height:100%;background:linear-gradient(90deg,#7a1f17,#c0392b);transition:width .2s}

/* RIGHT TABS */
#right{width:330px;flex:0 0 330px;background:var(--bg2);border-left:2px solid var(--border);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:2px solid var(--border);flex:0 0 auto}
.tab{flex:1;padding:9px 4px;text-align:center;font-family:'Cinzel',serif;font-size:11px;color:var(--ink-soft);cursor:pointer;letter-spacing:.8px;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.1s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tp{display:none;flex:1;flex-direction:column;min-height:0}
.tp.on{display:flex}

/* TAB: TOKENS */
#tlist{max-height:160px;overflow-y:auto;flex:0 0 auto}
.tr{display:flex;align-items:center;gap:7px;padding:6px 11px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.tr:hover{background:#251e14}
.tr.sel{background:#33291a}
.tr .dot{width:13px;height:13px;border-radius:50%;flex:0 0 13px}
.tr .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .th{font-size:11px;color:var(--ink-soft)}
/* detail */
#det{flex:1;overflow-y:auto}
#detE{padding:24px 14px;text-align:center;color:var(--ink-soft);font-style:italic;font-size:13px}
.sb{padding:12px 13px}
.sb h2{font-size:19px;color:var(--gold);font-family:'Cinzel',serif;display:flex;align-items:center;gap:8px}
.sb .dot2{width:18px;height:18px;border-radius:50%;flex:0 0 18px}
.sb .meta{font-size:12px;font-style:italic;color:var(--ink-soft);margin:2px 0 8px}
.rl{height:1.5px;background:linear-gradient(90deg,var(--gold-soft),transparent);margin:7px 0}
.hprow{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.hpbig{font-family:'Cinzel',serif;font-size:22px;color:#e08a82}
.hprow input{width:50px;text-align:center}
.acrow{display:flex;gap:14px;font-size:13px;margin:6px 0}
.acrow b{color:var(--gold)}
.abg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}
.ab{background:#1a140e;border:1px solid var(--border);border-radius:3px;text-align:center;padding:4px 2px}
.ab .ak{font-family:'Cinzel',serif;font-size:9px;color:var(--gold-soft)}
.ab .av{font-size:14px}.ab .am{font-size:10px;color:var(--ink-soft)}
.sbf{margin:6px 0;font-size:13px;line-height:1.4}
.sbf b{color:var(--gold);font-family:'Cinzel',serif;font-size:11px;text-transform:uppercase}
.act{margin:6px 0;font-size:13px;line-height:1.4}
.act b{color:#d8b96a}

/* TAB: MONSTROS */
#monsterList{overflow-y:auto;flex:1}
.mg{font-family:'Cinzel',serif;font-size:10px;color:var(--gold-soft);letter-spacing:1px;text-transform:uppercase;padding:8px 12px 4px;border-bottom:1px solid var(--border)}
.mc{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s}
.mc:hover{background:#251e14}
.mc .mi{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 36px}
.mc .mn{font-size:14px;color:var(--ink)}
.mc .ms{font-size:11px;color:var(--ink-soft);font-style:italic}
.mc .ma{font-size:11px;color:var(--gold);background:#2a2113;border:1px solid var(--gold-soft);border-radius:3px;padding:2px 6px;margin-left:auto;white-space:nowrap}

/* TAB: DADOS */
#diceLog{max-height:140px;overflow-y:auto;padding:5px 11px;flex:0 0 auto}
.dl{padding:3px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px}
.dr{font-family:'Cinzel',serif;color:var(--gold);font-weight:700}
.dc{color:#7bd47b}.df{color:var(--red)}
.dform{display:flex;gap:6px;padding:8px 12px}

/* TAB: INICIATIVA */
#initList{flex:1;overflow-y:auto}
.ir{display:flex;align-items:center;gap:7px;padding:6px 11px;border-bottom:1px solid var(--border);font-size:13px}
.ir.cur{background:linear-gradient(90deg,#3a2d18,transparent);border-left:3px solid var(--gold)}
.ir .inum{font-family:'Cinzel',serif;color:var(--gold);width:24px;text-align:center;font-weight:700}
.ir .inm{flex:1}
.ir input{width:44px;text-align:center;padding:2px}
.ictrl{display:flex;gap:6px;padding:8px 12px;flex:0 0 auto}

/* MODAL */
#mbg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100}
#mbg.on{display:flex}
.modal{background:var(--panel);border:2px solid var(--border);border-radius:7px;width:400px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #000}
.modal h3{color:var(--gold);margin-bottom:11px;font-size:17px;font-family:'Cinzel',serif}
.mf{margin:8px 0}
.mf label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:2px}
.mrow{display:flex;gap:7px}
.mact{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.sw{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.sw span{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw span.sel{border-color:var(--gold)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold-soft);color:var(--gold);padding:8px 16px;border-radius:5px;z-index:200;opacity:0;transition:.3s;pointer-events:none;font-size:13px}
.toast.on{opacity:1}
</style>
</head>
<body>

<div id="top">
  <h1>⚜ Thornwall</h1>
  <div class="sp"></div>
  <div class="dq" id="dq"></div>
  <button class="sm" onclick="saveNow(true)">💾</button>
  <button class="sm" onclick="exportData()">⬇ Export</button>
  <button class="sm" onclick="document.getElementById('impF').click()">⬆ Import</button>
  <button class="sm red" onclick="resetAll()">↺ Reset</button>
  <input type="file" id="impF" accept=".json" style="display:none" onchange="importData(event)">
</div>

<div id="main">
  <!-- LEFT: cenas -->
  <div id="left">
    <div class="ph">Cenas <button class="sm" onclick="addScene()">+</button></div>
    <div id="sceneList" class="sc"></div>
    <div id="sceneNote" class="sc"></div>
  </div>

  <!-- CENTER: mapa -->
  <div id="center">
    <div id="mapWrap">
      <div id="map">
        <div id="mapImg"></div>
        <div id="gridLayer"></div>
      </div>
    </div>
    <div id="mapCtrls">
      <button onclick="zoom(1.15)" title="+">+</button>
      <button onclick="zoom(.87)" title="-">−</button>
      <button onclick="resetView()" title="Reset">⊙</button>
      <button class="gold" onclick="openAddToken()" title="+ Token">＋</button>
    </div>
    <div id="hint">Pan: arraste fundo · Zoom: scroll · Token: arraste</div>
  </div>

  <!-- RIGHT: abas -->
  <div id="right">
    <div id="tabs">
      <div class="tab on" onclick="switchTab('tokens')">Tokens</div>
      <div class="tab" onclick="switchTab('monsters')">Monstros</div>
      <div class="tab" onclick="switchTab('dice')">Dados</div>
      <div class="tab" onclick="switchTab('init')">Iniciativa</div>
    </div>

    <!-- ABA TOKENS -->
    <div class="tp on" id="tp-tokens">
      <div class="ph">Tokens na cena <button class="sm" onclick="openAddToken()">+</button></div>
      <div id="tlist" class="sc"></div>
      <div class="ph" style="justify-content:space-between">
        Ficha
        <span id="detActs"></span>
      </div>
      <div id="det" class="sc"><div id="detE">Clique num token</div></div>
    </div>

    <!-- ABA MONSTROS -->
    <div class="tp" id="tp-monsters">
      <div class="ph">Clique para spawnar no mapa</div>
      <div id="monsterList" class="sc"></div>
    </div>

    <!-- ABA DADOS -->
    <div class="tp" id="tp-dice">
      <div class="ph">Rolador de Dados</div>
      <div class="dform">
        <input id="diceIn" placeholder="ex: 2d6+3 ou 1d20" onkeydown="if(event.key==='Enter')rollFormula()">
        <button class="gold" onclick="rollFormula()">Rolar</button>
      </div>
      <div id="diceLog" class="sc"></div>
    </div>

    <!-- ABA INICIATIVA -->
    <div class="tp" id="tp-init">
      <div class="ph">Iniciativa
        <span>
          <button class="sm" onclick="autoInit()" title="Rola inimigos">🎲</button>
          <button class="sm red" onclick="clearInit()">✕</button>
        </span>
      </div>
      <div id="initList" class="sc"></div>
      <div class="ictrl">
        <button onclick="addInitManual()">+ Add</button>
        <button class="gold" style="flex:1" onclick="nextTurn()">Próximo ▸</button>
      </div>
    </div>
  </div>
</div>

<div id="mbg" onclick="if(event.target===this)closeMod()">
  <div class="modal" id="mbody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ====================================================
   DADOS DA ONE-SHOT
   ==================================================== */

let V={x:-250,y:-100,z:.75};
function applyV(){$('#map').style.transform=`translate(${V.x}px,${V.y}px) scale(${V.z})`;}
function zoom(f){
  const c=$('#center').getBoundingClientRect();
  const wx=(c.width/2-V.x)/V.z, wy=(c.height/2-V.y)/V.z;
  V.z=Math.max(.25,Math.min(2.5,V.z*f));
  V.x=c.width/2-wx*V.z; V.y=c.height/2-wy*V.z;
  applyV();
}
function resetView(){V={x:-250,y:-100,z:.75};applyV();}

const mw=$('#mapWrap');
let pan=false,ps;
mw.addEventListener('mousedown',e=>{if(e.target.closest('.tok'))return;pan=true;mw.classList.add('pan');ps={x:e.clientX-V.x,y:e.clientY-V.y};});
window.addEventListener('mousemove',e=>{if(pan){V.x=e.clientX-ps.x;V.y=e.clientY-ps.y;applyV();}});
window.addEventListener('mouseup',()=>{pan=false;mw.classList.remove('pan');});
mw.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.91);},{passive:false});

function sceneToks(){return D.tokens.filter(t=>t.scene===D.scene);}
function renderTokens(){
  $$('.tok').forEach(e=>e.remove());
  const map=$('#map');
  sceneToks().forEach(t=>{
    const el=document.createElement('div');
    el.className='tok'+(t.id===sel?' sel':'')+(t.hp<=0?' dead':'');
    el.style.cssText=`left:${t.x}px;top:${t.y}px;background:${t.color}`;
    el.dataset.id=t.id;
    const ini=t.name.replace(/[^A-Za-zÀ-ÿ0-9]/g,'').slice(0,2).toUpperCase()||'??';
    const pct=t.maxhp?Math.max(0,Math.min(100,100*t.hp/t.maxhp)):100;
    el.innerHTML=`<span class="lbl">${esc(t.name)}</span>${ini}
      ${t.maxhp?`<div class="hb"><div class="hf" style="width:${pct}%"></div></div>`:''}`;
    makeDrag(el,t);
    el.addEventListener('click',e=>{e.stopPropagation();selTok(t.id);});
    el.addEventListener('dblclick',e=>{e.stopPropagation();const n=prompt('Nome:',t.name);if(n){t.name=n;render();save();}});
    map.appendChild(el);
  });
  renderTList();
}
function makeDrag(el,t){
  let drag=false,off,moved;
  el.addEventListener('mousedown',e=>{
    e.stopPropagation();drag=true;moved=false;
    selTok(t.id);
    const r=$('#map').getBoundingClientRect();
    off={x:(e.clientX-r.left)/V.z-t.x,y:(e.clientY-r.top)/V.z-t.y};
    el.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',e=>{
    if(!drag)return;moved=true;
    const r=$('#map').getBoundingClientRect();
    t.x=Math.round((e.clientX-r.left)/V.z-off.x);
    t.y=Math.round((e.clientY-r.top)/V.z-off.y);
    el.style.left=t.x+'px';el.style.top=t.y+'px';
  });
  window.addEventListener('mouseup',()=>{if(drag){drag=false;el.style.cursor='grab';if(moved)save();}});
}

function rollDie(d){const r=1+Math.floor(Math.random()*d);logDice('d'+d,[r],0,r,d);return r;}
function rollFormula(){
  const f=($('#diceIn').value||'1d20').trim().toLowerCase();
  const m=f.match(/^(\d*)d(\d+)\s*([+-]\s*\d+)?$/);
  if(!m){toast('Formato: XdY+Z');return;}
  const n=parseInt(m[1]||1),d=parseInt(m[2]),mod=m[3]?parseInt(m[3].replace(/\s/g,'')):0;
  if(n>50){toast('Máx 50 dados');return;}
  const rolls=[];let sum=0;
  for(let i=0;i<n;i++){const r=1+Math.floor(Math.random()*d);rolls.push(r);sum+=r;}
  logDice(f,rolls,mod,sum+mod,d);
}
function rollFor(id){const t=D.tokens.find(x=>x.id===id);const r=rollDie(20);toast(`${t.name}: d20 = ${r}`);}
function logDice(label,rolls,mod,total,die){
  D.dice.unshift({label,rolls,mod,total,die,ts:Date.now()});
  if(D.dice.length>40)D.dice.pop();
  renderDiceLog();save();
  toast(`${label}: ${total}`);
}
function renderDiceLog(){
  const b=$('#diceLog');b.innerHTML='';
  D.dice.forEach(e=>{
    let cls='';if(e.die===20&&e.rolls.length===1){if(e.rolls[0]===20)cls='dc';if(e.rolls[0]===1)cls='df';}
    const det=e.rolls.length>1||e.mod?`[${e.rolls.join(',')}]${e.mod?(e.mod>0?'+'+e.mod:e.mod):''}`:'';
    const d=document.createElement('div');d.className='dl';
    d.innerHTML=`<span>${esc(e.label)} <span style="color:var(--ink-soft);font-size:11px">${det}</span></span>
      <span class="dr ${cls}">${e.total}</span>`;
    b.appendChild(d);
  });
}

/* ====================================================
   INICIATIVA
   ==================================================== */
function renderInit(){
  const b=$('#initList');b.innerHTML='';
  if(!D.init.length){b.innerHTML='<div style="padding:12px;color:var(--ink-soft);font-style:italic;font-size:12px">Sem combatentes. Use 🎲 pra rolar inimigos ou + Add.</div>';return;}
  D.init.forEach((c,i)=>{
    const r=document.createElement('div');r.className='ir'+(i===D.turn?' cur':'');
    const tk=c.tid?D.tokens.find(t=>t.id===c.tid):null;
    const hp=tk?` <span style="color:var(--ink-soft);font-size:11px">${tk.hp}/${tk.maxhp}</span>`:'';
    r.innerHTML=`<input type="number" value="${c.roll}" style="width:42px" onchange="setInit(${i},this.value)">
      <span class="inm">${esc(c.name)}${hp}</span>
      <button class="sm red" onclick="rmInit(${i})">✕</button>`;
    b.appendChild(r);
  });
}
function setInit(i,v){D.init[i].roll=parseInt(v)||0;sortInit();}
function sortInit(){const cur=D.init[D.turn];D.init.sort((a,b)=>b.roll-a.roll);D.turn=Math.max(0,D.init.indexOf(cur));renderInit();save();}
function addToInit(id){
  const t=D.tokens.find(x=>x.id===id);
  if(D.init.find(c=>c.tid===id)){toast('Já na iniciativa');return;}
  const r=1+Math.floor(Math.random()*20)+Math.floor(((t.stat.dex||10)-10)/2);
  D.init.push({name:t.name,roll:r,tid:id});sortInit();toast(`${t.name}: iniciativa ${r}`);
}
function autoInit(){
  sceneToks().filter(t=>t.type==='enemy'&&t.hp>0).forEach(t=>{
    if(D.init.find(c=>c.tid===t.id))return;
    const r=1+Math.floor(Math.random()*20)+Math.floor(((t.stat.dex||10)-10)/2);
    D.init.push({name:t.name,roll:r,tid:t.id});
  });
  sortInit();toast('Iniciativa dos inimigos rolada');
}
function addInitManual(){
  const nm=prompt('Nome:');if(!nm)return;
  const r=parseInt(prompt('Iniciativa (número):','10'))||10;
  D.init.push({name:nm,roll:r,tid:null});sortInit();
}
function rmInit(i){D.init.splice(i,1);if(D.turn>=D.init.length)D.turn=0;renderInit();save();}
function clearInit(){D.init=[];D.turn=0;renderInit();save();}
function nextTurn(){if(!D.init.length)return;D.turn=(D.turn+1)%D.init.length;renderInit();save();toast('Vez: '+D.init[D.turn].name);}

/* ====================================================
   ABAS
   ==================================================== */
function switchTab(id){
  $$('.tab').forEach((t,i)=>{const ids=['tokens','monsters','dice','init'];t.classList.toggle('on',ids[i]===id);});
  $$('.tp').forEach(p=>p.classList.remove('on'));
  const p=$('#tp-'+id);if(p)p.classList.add('on');
}

/* ====================================================
   MODAL / UTIL
   ==================================================== */
function openMod(html){$('#mbody').innerHTML=html;$('#mbg').classList.add('on');}
function closeMod(){$('#mbg').classList.remove('on');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600);}
function esc(s){return(s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ea(s){return esc(s).replace(/"/g,'&quot;');}
function nl(s){return esc(s).replace(/\\n/g,'<br>').replace(/\n/g,'<br>');}
function $$(s){return document.querySelectorAll(s);}
function exportData(){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='thornwall.json';a.click();toast('Exportado');
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{D=JSON.parse(r.result);saveNow();render();toast('Importado');}catch{toast('Arquivo inválido');}};
  r.readAsText(f);ev.target.value='';
}
function resetAll(){
  if(confirm('Restaurar os dados originais da one-shot? Perderá todas as alterações.'))
  {D=DEFAULT_DATA();sel=null;saveNow();render();resetView();toast('Restaurado');}
}

/* ====================================================
   RENDER
   ==================================================== */
function render(){
  renderScenes();
  renderTokens();
  renderDet();
  renderDiceLog();
  renderInit();
}
function init(){
  load();
  renderDiceQuick();
  renderMonsters();
  render();
  applyV();
  window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod();});
}
init();
</script>
</body>
</html>
